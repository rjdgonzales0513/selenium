browser=chrome
headless=false
explicitWait=10
env=qa



base.url=https://reqres.in/api

# ---- Bearer login flow (used by AuthManager.getBearerToken()) ----
# Endpoint the login POST is sent to (relative to base.url)
auth.login.endpoint=/login
# Credentials sent as the login request body: {"email": ..., "password": ...}
auth.username=eve.holt@reqres.in
auth.password=cityslicka
# JSON path in the login response where the token lives
auth.token.jsonpath=token

# ---- Static API key (demo-only requirement of reqres.in, see ApiSpec) ----
auth.token=reqres-free-v1

# Timeout in ms used by response spec
request.timeout=10000